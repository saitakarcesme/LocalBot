<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LocalBot — L eyes</title><style>.localbot-figure{display:inline-block;flex:none;vertical-align:middle}.localbot-figure svg{width:100%;height:100%;overflow:visible}.figure-body{transform-origin:50px 60px;animation:figure-idle 6s ease-in-out infinite}.figure-disc{fill:var(--figure-color);stroke:color-mix(in srgb,var(--figure-color),#000 12%);stroke-width:.6}.figure-gaze{transform-origin:50px 48px;transition:transform .45s ease}.figure-blink{transform-origin:50px 48px;animation:figure-blink 7s infinite}.figure-blink path{fill:none;stroke:#151517;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.state-thinking .figure-body{animation:figure-think 3.6s ease-in-out infinite}.state-thinking .figure-gaze{transform:translateY(-6px)}
.state-typing .figure-body{animation:figure-type .65s ease-in-out infinite}.state-typing .figure-gaze{animation:figure-scan .8s ease-in-out infinite alternate}
.state-coding .figure-body{animation:figure-code 1.1s ease-in-out infinite}.state-coding .figure-gaze{transform:translateY(3px) scaleY(.75)}
.state-researching .figure-body{animation:figure-think 4s ease-in-out infinite}.state-researching .figure-gaze{animation:figure-research 5s ease-in-out infinite}
.state-reading .figure-gaze{animation:figure-read 3s ease-in-out infinite}.state-reading .figure-body{animation:none}
.state-listening .figure-body{animation:none;transform:scale(var(--voice-scale))}.state-listening .figure-gaze{transform:scale(1.12)}
.state-speaking .figure-body{animation:figure-speak .9s ease-in-out infinite}.state-speaking .figure-gaze{animation:figure-scan 2s ease-in-out infinite alternate}
.state-success .figure-body{animation:figure-success .9s ease-out 1}.state-success .figure-gaze{animation:figure-happy .9s ease-out 1}
.state-error .figure-body{animation:figure-error .65s ease-out 1}.state-error .figure-gaze{animation:figure-sad 1.3s ease-out 1}
.localbot-figure:is(.is-paused,.is-offscreen) *{animation-play-state:paused!important}
@keyframes figure-idle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-1px)}}
@keyframes figure-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes figure-think{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes figure-type{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes figure-scan{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes figure-code{0%,100%{transform:rotate(3deg) scaleY(.97)}40%{transform:rotate(1deg) translateY(-1px)}}
@keyframes figure-research{0%,100%{transform:translate(-4px,-2px)}25%{transform:translate(4px,-4px)}55%{transform:translate(3px,3px)}80%{transform:translate(-3px,2px)}}
@keyframes figure-read{0%,30%{transform:translate(-4px,-4px)}24%{transform:translate(4px,-4px)}32%,62%{transform:translate(-4px,0)}56%{transform:translate(4px,0)}64%,96%{transform:translate(-4px,4px)}90%{transform:translate(4px,4px)}}
@keyframes figure-speak{0%,100%{transform:scale(.99)}35%{transform:scale(1.025)}65%{transform:scale(1.005)}}
@keyframes figure-success{0%,100%{transform:translateY(0)}35%{transform:translateY(-8px) rotate(-5deg)}65%{transform:translateY(1px) scaleY(.96)}}
@keyframes figure-happy{35%{transform:translateY(-2px) rotate(-3deg) scaleY(.85)}}
@keyframes figure-error{20%,60%{transform:translateX(-2px)}40%,80%{transform:translateX(2px)}}
@keyframes figure-sad{25%,60%{transform:translateY(5px) scale(.85)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.localbot-figure *{animation:none!important;transition:none!important}}
*{box-sizing:border-box}body{background:#141414;color:#eee;font:15px system-ui;margin:0;padding:40px}h1{font-weight:550}p{color:#929292;line-height:1.6}button,select{background:#292929;color:#eee;border:1px solid #555;border-radius:9px;padding:10px;font:inherit}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:28px}article{background:#202020;border:1px solid #333;border-radius:20px;padding:24px;text-align:center}article .figure{width:100px;height:100px;margin:16px auto}h2{font-size:14px;font-weight:500;text-transform:capitalize}.colors{display:flex;gap:18px;margin-top:28px;align-items:center;flex-wrap:wrap}.colors .figure{width:44px;height:44px}.light{background:#fafafa;color:#222}.light article{background:#efefef;border-color:#ddd}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:20px}}</style><h1>LocalBot</h1><p>L gözlü yeni kimlik · Beyaz ana figür ve renkli bot ailesi.</p><header><button id="theme">Açık / koyu</button><button id="pause" aria-pressed="false">Duraklat</button><button id="replay">Success / Error tekrar</button><label>Boyut <select id="size"><option>100</option><option>24</option><option>48</option><option>160</option></select></label></header><main class="grid"><article><span role="img" aria-label="idle" class="localbot-figure figure state-idle" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>idle</h2></article><article><span role="img" aria-label="thinking" class="localbot-figure figure state-thinking" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>thinking</h2></article><article><span role="img" aria-label="typing" class="localbot-figure figure state-typing" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>typing</h2></article><article><span role="img" aria-label="coding" class="localbot-figure figure state-coding" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>coding</h2></article><article><span role="img" aria-label="researching" class="localbot-figure figure state-researching" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>researching</h2></article><article><span role="img" aria-label="reading" class="localbot-figure figure state-reading" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>reading</h2></article><article><span role="img" aria-label="listening" class="localbot-figure figure state-listening" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>listening</h2></article><article><span role="img" aria-label="speaking" class="localbot-figure figure state-speaking" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>speaking</h2></article><article><span role="img" aria-label="success" class="localbot-figure figure state-success" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>success</h2></article><article><span role="img" aria-label="error" class="localbot-figure figure state-error" style="--figure-color:#eeeef2;--voice-scale:1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><h2>error</h2></article></main><div class="colors"><span class="localbot-figure figure state-idle" style="--figure-color:#eeeef2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#86c5f7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#7fd8b0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#f2a2c8"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#b5a3e5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#f3c66f"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span><span class="localbot-figure figure state-idle" style="--figure-color:#f49a83"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><g class="figure-body"><circle class="figure-disc" cx="50" cy="50" r="46"/><g class="figure-gaze"><g class="figure-blink"><path d="M35 36 Q28 46 28 55 Q28 58 34 57 Q40 56 44 58"/><path d="M63 36 Q56 46 56 55 Q56 58 62 57 Q68 56 72 58"/></g></g></g></svg></span></div><p>Listening: mikrofon bağlı değil; yapay ses titreşimi yok. Hareketi azalt tercihi desteklenir.</p><script>document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#pause').onclick=e=>{let p=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',p);document.querySelectorAll('.figure').forEach(x=>x.classList.toggle('is-paused',p));};document.querySelector('#size').onchange=e=>document.querySelectorAll('article .figure').forEach(x=>{x.style.width=x.style.height=e.target.value+'px'});document.querySelector('#replay').onclick=()=>document.querySelectorAll('.state-success,.state-error').forEach(x=>{let c=x.className;x.className='localbot-figure figure';void x.offsetWidth;x.className=c});document.addEventListener('visibilitychange',()=>document.querySelectorAll('.figure').forEach(x=>x.classList.toggle('is-paused',document.hidden)));</script></html>
