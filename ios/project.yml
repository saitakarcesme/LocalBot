name: LocalBotRemote
options:
  bundleIdPrefix: app.localbot
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LocalBot
    INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown in LocalBot on your Mac.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    PRODUCT_BUNDLE_IDENTIFIER: app.localbot.remote
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.13.0
targets:
  LocalBotRemote:
    dependencies:
      - package: SwiftTerm
    type: application
    platform: iOS
    sources:
      - LocalBotRemote
      - ../shared/Resources/Launch.mp4
      - ../macos/Sources/LocalBot/LaunchScreen.swift
      - ../shared/RemoteClient.swift
      - ../macos/Sources/LocalBot/ResearchView.swift
      - ../macos/Sources/LocalBot/PersonalContextView.swift
      - ../macos/Sources/LocalBot/ProfileView.swift
      - ../macos/Sources/LocalBot/Models.swift
      - ../macos/Sources/LocalBot/LocalBotMascot.swift
    settings:
      base:
        PRODUCT_NAME: LocalBotRemote
