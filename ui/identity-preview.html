<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LocalBot — L eyes</title><style>.localbot-figure{display:inline-block;flex:none;vertical-align:middle}.localbot-figure svg{width:100%;height:100%;overflow:visible}.figure-disc{fill:var(--figure-color);stroke:color-mix(in srgb,var(--figure-color),#000 12%);stroke-width:.6}.figure-gaze,.figure-blink{transform-origin:50px 48px}.figure-gaze{transition:transform .45s ease}.figure-blink path{fill:none;stroke:#151517}
/* Motion phrases have anticipation, focus, and recovery instead of uniform bobbing. */
.figure-body{transform-origin:50px 62px;animation:figure-idle 8s ease-in-out infinite}
.figure-blink path{stroke-width:9;stroke-linejoin:round;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.figure-blink{animation:figure-blink 8.3s infinite}
.state-idle .figure-gaze{animation:figure-curious 11s ease-in-out infinite}
.state-thinking .figure-body{animation:figure-think 4.8s cubic-bezier(.45,0,.25,1) infinite}
.state-thinking .figure-gaze{animation:figure-thought 4.8s ease-in-out infinite}
.state-thinking .eye-right{animation:figure-squint 4.8s ease-in-out infinite}
.state-typing .figure-body{animation:figure-type 1.2s ease-in-out infinite}
.state-typing .figure-gaze{animation:figure-keystrokes 1.2s ease-in-out infinite}
.state-coding .figure-body{animation:figure-code 2.6s ease-in-out infinite}
.state-coding .figure-gaze{animation:figure-focus 2.6s ease-in-out infinite}
.state-researching .figure-body{animation:figure-investigate 6s ease-in-out infinite}
.state-researching .figure-gaze{animation:figure-research 6s ease-in-out infinite}
.state-reading .figure-body{animation:figure-read-body 4.5s ease-in-out infinite}
.state-reading .figure-gaze{animation:figure-read 4.5s ease-in-out infinite}
.state-listening .figure-body{transform:rotate(-5deg) scale(var(--voice-scale));transition:transform 100ms ease-out}
.state-listening .figure-gaze{transform:translate(2px,-3px) scale(1.12)}
.state-speaking .figure-body{animation:figure-speak 2.4s ease-in-out infinite}
.state-speaking .figure-gaze{animation:figure-speech-gaze 4.8s ease-in-out infinite}
.state-success .figure-body{animation:figure-success 1.3s cubic-bezier(.25,.7,.3,1) both}
.state-success .figure-gaze{animation:figure-happy 1.3s ease-in-out both}
.state-error .figure-body{animation:figure-error 1.3s ease-in-out both}
.state-error .figure-gaze{animation:figure-sad 1.3s ease-in-out both}
@keyframes figure-idle{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}35%{transform:translateY(-2px) rotate(2deg) scale(1.015,.99)}65%{transform:translateY(-1px) rotate(0) scale(.995,1.01)}}
@keyframes figure-curious{0%,22%,100%{transform:none}30%,40%{transform:translate(3px,-1px)}48%,76%{transform:none}82%,90%{transform:translate(-2px,1px)}}
@keyframes figure-blink{0%,39%,43%,47%,50%,100%{transform:scaleY(1)}41%,48.5%{transform:scaleY(.08)}}
@keyframes figure-think{0%,100%{transform:rotate(-3deg)}25%,43%{transform:translateY(-2px) rotate(8deg) scale(.98,1.02)}68%,83%{transform:rotate(-7deg) scale(1.015,.99)}}
@keyframes figure-thought{0%,100%{transform:translate(0,-3px)}25%,43%{transform:translate(5px,-7px) scaleX(.93)}68%,83%{transform:translate(-5px,-5px)}}
@keyframes figure-squint{25%,43%{transform:scaleY(.75)}0%,65%,100%{transform:none}}
@keyframes figure-type{0%,100%{transform:none}12%{transform:translateY(1px) scale(1.025,.97)}28%{transform:translateY(-4px) rotate(-3deg) scale(.98,1.02)}48%{transform:translateY(1px) scale(1.02,.98)}68%{transform:translateY(-3px) rotate(3deg)}85%{transform:translateY(0)}}
@keyframes figure-keystrokes{0%,100%{transform:translate(-3px,1px)}22%{transform:translate(0,2px)}40%{transform:translate(4px,1px)}56%{transform:translate(-4px,2px)}78%{transform:translate(3px,0)}}
@keyframes figure-code{0%,100%{transform:rotate(2deg) scale(1.02,.97)}15%,38%{transform:translateY(2px) rotate(5deg) scale(1.03,.96)}45%{transform:translateY(-2px) rotate(3deg)}55%,78%{transform:rotate(-2deg) scale(1.01,.98)}85%{transform:translateY(-1px)}}
@keyframes figure-focus{0%,100%{transform:translate(1px,3px) scaleY(.8)}15%,38%{transform:translate(-4px,4px) scaleY(.72)}55%,78%{transform:translate(4px,2px) scaleY(.82)}}
@keyframes figure-investigate{0%,100%{transform:none}18%,32%{transform:rotate(-9deg) translateY(-2px)}48%,62%{transform:rotate(9deg) scale(.97,1.02)}80%{transform:translateY(-3px)}}
@keyframes figure-research{0%,100%{transform:none}18%,32%{transform:translate(-7px,-4px) scaleX(.9)}48%,62%{transform:translate(7px,-2px) scaleX(.9)}76%,86%{transform:translate(0,5px)}}
@keyframes figure-read{0%{transform:translate(-5px,-5px)}24%{transform:translate(5px,-5px)}28%{transform:translate(-5px,0)}52%{transform:translate(5px,0)}56%{transform:translate(-5px,5px)}80%{transform:translate(5px,5px)}86%,100%{transform:translate(-5px,-5px)}}
@keyframes figure-read-body{0%,100%{transform:rotate(-2deg)}25%{transform:rotate(1deg)}55%,80%{transform:translateY(2px) rotate(3deg)}}
@keyframes figure-speak{0%,100%{transform:none}12%{transform:scale(1.035,.98) rotate(-2deg)}25%{transform:scale(.98,1.035)}40%{transform:scale(1.025,.99) rotate(2deg)}55%{transform:none}68%{transform:scale(.985,1.04) rotate(-2deg)}80%{transform:scale(1.025,.98)}90%{transform:none}}
@keyframes figure-speech-gaze{0%,100%{transform:none}20%,35%{transform:translate(-3px,-2px)}60%,80%{transform:translate(3px,1px)}}
@keyframes figure-success{0%,100%{transform:none}15%{transform:translateY(3px) scale(1.08,.9)}38%{transform:translateY(-12px) rotate(-9deg) scale(.94,1.07)}58%{transform:translateY(1px) rotate(3deg) scale(1.07,.93)}74%{transform:translateY(-3px) rotate(-2deg)}88%{transform:translateY(0)}}
@keyframes figure-happy{15%{transform:scaleY(.8)}38%,58%{transform:translateY(-3px) scale(1.03,.8)}100%{transform:none}}
@keyframes figure-error{0%,100%{transform:none}16%{transform:translateY(2px) scale(.96)}30%{transform:rotate(-5deg) translateX(-2px)}42%{transform:rotate(4deg) translateX(2px)}54%{transform:rotate(-3deg)}70%{transform:translateY(2px)}88%{transform:translateY(-1px)}}
@keyframes figure-sad{16%,60%{transform:translateY(6px) scale(.85,.8)}85%{transform:translateY(-1px)}100%{transform:none}}

.localbot-figure:is(.is-paused,.is-offscreen) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.localbot-figure *{animation:none!important;transition:none!important}}
